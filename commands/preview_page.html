<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="preview-token" content="__PREVIEW_TOKEN__">
<title>Banner bekijken</title>
<style>
  /* The look of DSlab's Product Layer (its globals.css): white page, coral bar,
     near-black type, rounded cards. Same tokens, copied rather than linked,
     because this page loads nothing from outside. Colour carries meaning:
     green only for "met", red only for a failure, coral is the brand. */
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --raised: #eef1f6; --line: #dfe4ec;
    --text: #181818; --muted: #5f6977;
    --brand: #f05f4b; --brand-dim: #e95a47; --brand-ink: #ffffff; --brand-soft: #fdeeeb;
    --ok: #5f8a0f; --ok-bg: #eef5e1; --warn: #b87400; --warn-bg: #fdf3e3;
    --bad: #d0021b; --bad-bg: #fdeaea; --bad-line: #f0bcbc;
    --backdrop: rgba(24, 24, 24, 0.5); --radius: 14px;
    --shadow: 0 1px 2px rgba(24, 24, 24, 0.04), 0 4px 16px rgba(24, 24, 24, 0.04);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1012; --surface: #16181c; --raised: #1d2026; --line: #2a2e36;
      --text: #f2f4f7; --muted: #9aa3b0; --brand-soft: #3a1f1b;
      --ok: #95c11f; --ok-bg: #1f2a10; --warn: #feaa1e; --warn-bg: #2e2410;
      --bad: #ff5a6a; --bad-bg: #2e1418; --bad-line: #5c2229; --shadow: none;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.55 Poppins, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }

  .topbar { background: var(--brand); color: var(--brand-ink); }
  .topbar .inner { max-width: 1280px; margin: 0 auto; padding: 12px 32px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .topbar h1 { font-size: 17px; font-weight: 600; margin: 0; }
  .topbar .spacer { flex: 1; }
  .topbar .meta { font-size: 14px; opacity: 0.9; white-space: nowrap; }

  .page { max-width: 1280px; margin: 0 auto; padding: 24px 32px 64px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 22px; box-shadow: var(--shadow); }
  .card + .card, .card + section, section + .card { margin-top: 18px; }
  .card h2, #field-report > strong { display: block; font-size: 1.05rem; font-weight: 600; margin: 0 0 12px; }

  /* toolbar: view, row, search */
  .toolbar { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: center; }
  .tabs { display: inline-flex; gap: 4px; padding: 3px; border-radius: 999px; background: var(--raised); }
  .tabs button { padding: 5px 14px; border: 1px solid transparent; border-radius: 999px; background: transparent; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--surface); border-color: var(--brand); color: var(--text); font-weight: 500; }
  .tabs button:hover { color: var(--text); }
  .inline-field { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
  select, input[type=search] { font: inherit; font-size: 14px; color: var(--text); background: var(--surface);
    padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; }
  select { max-width: 340px; }
  #row-search { width: 17em; }
  select:focus, input[type=search]:focus, button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  #row-search-count { font-size: 13px; }

  #refill-error { max-width: 1280px; margin: 18px auto 0; padding: 11px 15px; border-left: 3px solid var(--bad); background: var(--bad-bg); border-radius: 8px; }
  #refill-error:not([hidden]) { display: block; }

  /* the banner on a plain stage, like a proof sheet */
  #single { display: flex; flex-direction: column; align-items: flex-start; }
  #stage { position: relative; display: inline-block; background: #fff; box-shadow: 0 1px 2px rgba(24,24,24,.08), 0 6px 20px rgba(24,24,24,.10); border-radius: 4px; overflow: hidden; }
  #banner-frame, .cell iframe { border: 0; display: block; background: #fff; }
  #error-overlay { position: absolute; inset: 0; background: rgba(208, 2, 27, 0.94); color: #fff; padding: 14px; overflow: auto; font-size: 13px; }
  #error-overlay code { display: block; margin-bottom: 6px; font-weight: 600; }
  #scrubber { margin-top: 14px; display: flex; gap: 10px; align-items: center; font-size: 14px; }
  #scrubber-range { width: 360px; accent-color: var(--brand); }
  #scrubber-note { margin-top: 14px; font-size: 14px; color: var(--muted); }
  #ready-badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--ok-bg); color: var(--ok); }
  #ready-badge.late { background: var(--warn-bg); color: var(--warn); }

  #overview { display: flex; flex-wrap: wrap; gap: 22px; align-items: flex-start; }
  #overview > p { margin: 0; }
  .cell { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px 14px; box-shadow: var(--shadow); }
  .cell .label { display: block; font: inherit; font-size: 14px; font-weight: 500; margin: 0 0 8px; padding: 0; border: 0; background: none; cursor: pointer; color: var(--text); }
  .cell .label:hover { color: var(--brand); }
  .cell .label::after { content: " \2192"; color: var(--muted); }
  .cell .box { position: relative; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 1px 2px rgba(24,24,24,.08); }
  .cell .rowerr { position: absolute; inset: 0; background: rgba(208, 2, 27, 0.94); color: #fff; padding: 8px; overflow: auto; font-size: 12px; }

  /* real render */
  #render-panel .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #render-button { display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px; border: 1px solid var(--brand); border-radius: 10px;
    background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 500; cursor: pointer; }
  #render-button:hover:not(:disabled) { background: var(--brand-dim); border-color: var(--brand-dim); }
  #render-button:disabled { opacity: 0.6; cursor: progress; }
  .format { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; font-size: 14px; cursor: pointer; background: var(--surface); }
  .format:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
  .format:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
  .format input { accent-color: var(--brand); margin: 0; }
  #render-error { margin-top: 12px; padding: 11px 15px; border-left: 3px solid var(--bad); background: var(--bad-bg); border-radius: 8px; }
  #render-result { margin-top: 14px; padding: 14px 16px; background: var(--raised); border-radius: 10px; font-size: 14px; }
  #render-result img { display: block; margin-top: 10px; max-width: 100%; border-radius: 4px; box-shadow: 0 1px 2px rgba(24,24,24,.08), 0 6px 20px rgba(24,24,24,.10); }
  .dots::after { content: ""; display: inline-block; width: 1.2em; text-align: left; animation: dots 1.2s steps(4, end) infinite; }
  @media (prefers-reduced-motion: reduce) { .dots::after { animation: none; content: "..."; } }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  /* field report: neutral information, warnings in amber */
  #field-report h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 14px 0 6px; }
  #field-report ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
  #field-report li { padding: 3px 10px; border-radius: 999px; background: var(--raised); font-size: 13px; }
  #field-report .warn li { background: var(--warn-bg); color: var(--warn); }
  #field-report > div > h2:first-child { margin-top: 4px; }
  #field-report h3 { font-size: 15px; font-weight: 600; margin: 18px 0 0; padding-top: 12px; border-top: 1px solid var(--line); }
  #field-report > div:first-of-type h3 { border-top: 0; padding-top: 0; margin-top: 4px; }

  #render-modal { position: fixed; inset: 0; background: var(--backdrop); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #render-modal .dialog { background: var(--surface); padding: 22px 26px; max-width: 440px; border-radius: var(--radius); box-shadow: 0 12px 40px rgba(24,24,24,.25); }
  #render-modal .dialog strong { font-size: 1.1rem; }
  #render-modal .buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  #render-modal .buttons button { padding: 8px 16px; border-radius: 10px; font: inherit; font-weight: 500; cursor: pointer; }
  #render-cancel { border: 1px solid var(--line); background: var(--surface); color: var(--text); }
  #render-confirm { border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink); }
  @media (max-width: 720px) { .page, .topbar .inner { padding-left: 16px; padding-right: 16px; } #scrubber-range { width: 200px; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="inner">
    <h1>Banner bekijken</h1>
    <span class="spacer"></span>
    <span id="size-label" class="meta"></span>
    <span id="charge" class="meta"></span>
  </div>
</header>
<div id="refill-error" hidden></div>
<main class="page">
  <div class="card toolbar">
    <div class="tabs" role="group" aria-label="Weergave">
      <button id="view-row" type="button" aria-pressed="true">Eén regel</button>
      <button id="overview-toggle" type="button" aria-pressed="false">Alle regels</button>
    </div>
    <label class="inline-field">Regel <select id="row-picker"></select></label>
    <input id="row-search" type="search" placeholder="zoek in alle kolommen" aria-label="Zoek een regel op een waarde in een van de kolommen">
    <span id="row-search-count" class="muted" aria-live="polite" hidden></span>
    <span id="ready-badge" hidden></span>
  </div>
  <section id="single" class="card">
    <div id="stage">
      <iframe id="banner-frame" title="Banner" sandbox="allow-scripts"></iframe>
      <div id="error-overlay" hidden></div>
    </div>
    <div id="scrubber" hidden>
      <label for="scrubber-range">Tijd</label>
      <input id="scrubber-range" type="range" min="0" max="10" step="0.01" value="0">
      <span id="scrubber-time">0.00 s</span>
    </div>
    <div id="scrubber-note" hidden>geen tijdlijn: als GIF of video wordt deze banner geweigerd</div>
  </section>
  <section id="overview" hidden></section>
  <section id="render-panel" class="card">
    <h2 id="render-title">Echte render</h2>
    <div class="controls">
      <button id="render-button" type="button">Echte render (normale prijs)</button>
      <label class="format"><input type="radio" name="render-format" value="png" checked> PNG</label>
      <label class="format"><input type="radio" name="render-format" value="gif"> GIF (10 frames)</label>
    </div>
    <div id="render-error" hidden></div>
    <div id="render-result" hidden></div>
  </section>
  <section id="field-report" class="card"></section>
</main>
<div id="render-modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="render-modal-title">
    <strong id="render-modal-title">Echte render</strong>
    <p>Dit is een echte render tegen de normale prijs, geen gratis voorbeeld.</p>
    <p id="render-modal-price"></p>
    <div class="buttons">
      <button id="render-cancel" type="button">Annuleren</button>
      <button id="render-confirm" type="button">Bevestigen</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var state = null;
  var view = "row";
  var selected = 0;
  var navStart = 0;
  var readyAt = {};
  var readyTimer = null;
  var $ = function (id) { return document.getElementById(id); };

  function readHash() {
    var h = new URLSearchParams(location.hash.slice(1));
    if (h.get("view") === "all") view = "all";
    if (h.get("row")) selected = parseInt(h.get("row"), 10) || 0;
  }
  function writeHash() {
    history.replaceState(null, "", "#row=" + selected + "&view=" + view);
  }

  function frameSrc(i) {
    var r = state.report;
    var p = r.entry.split("/").map(encodeURIComponent).join("/");
    // the banner lives on its own origin (a second listener), see the CSP
    return state.banner_base + "/rows/" + i + "/" + p + "?v=" + state.version;
  }
  function rowOf(i) {
    var rows = state.report.rows;
    for (var k = 0; k < rows.length; k++) { if (rows[k].index === i) return rows[k]; }
    return rows[0];
  }
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text != null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function errText(err) {
    return err.file + (err.line ? ":" + err.line : "") + " " + err.message;
  }

  /* search: a row matches when any of its values (or its label) contains the text */
  var query = "";
  function norm(t) { return String(t == null ? "" : t).toLowerCase(); }
  function matchedValue(row) {
    if (!query) return null;
    var vals = row.values || {};
    for (var k in vals) {
      if (Object.prototype.hasOwnProperty.call(vals, k) && norm(vals[k]).indexOf(query) !== -1) return String(vals[k]);
    }
    return norm(row.label).indexOf(query) !== -1 ? "" : null;
  }
  function visibleRows() {
    return state.report.rows.filter(function (r) { return !query || matchedValue(r) !== null; });
  }
  /* a short readable value for the picker: the first field that holds plain
     text (no file, link or style), in the template's field order */
  function summaryOf(row) {
    var vals = row.values || {}, fields = state.report.fields || [];
    for (var i = 0; i < fields.length; i++) {
      var f = String(fields[i]), v = vals[f];
      if (!v || /(_url|_file|_css)$/.test(f) || f === "id") continue;
      v = String(v).trim();
      if (v && !/^(https?:|#|[0-9.,]+$)/.test(v)) return v.length > 40 ? v.slice(0, 39) + "…" : v;
    }
    return "";
  }
  function optionText(row) {
    var m = matchedValue(row), extra = m ? m : summaryOf(row);
    if (extra && extra.length > 40) extra = extra.slice(0, 39) + "…";
    return extra ? row.label + " · " + extra : row.label;
  }
  function renderPicker() {
    var sel = $("row-picker"), rows = visibleRows();
    sel.textContent = "";
    if (view === "all") {
      /* a placeholder, so choosing any row (also the last one shown) is a change */
      var ph = el("option", "alle regels");
      ph.value = "";
      sel.appendChild(ph);
    }
    rows.forEach(function (r) {
      var o = el("option", optionText(r));
      o.value = String(r.index);
      sel.appendChild(o);
    });
    if (!rows.length) {
      var none = el("option", "geen regel bevat \u201c" + query + "\u201d");
      none.value = "";
      none.disabled = true;
      sel.appendChild(none);
    }
    var count = $("row-search-count");
    count.hidden = !query;
    count.textContent = query ? (rows.length === 1 ? "1 regel" : rows.length + " regels") : "";
    if (view !== "all" && !state.report.rows.some(function (r) { return r.index === selected; })) selected = state.report.rows[0].index;
    /* one row shown while a search is on: it is one of the matches */
    if (view !== "all" && rows.length && !rows.some(function (r) { return r.index === selected; })) selected = rows[0].index;
    sel.value = view === "all" || !rows.length ? "" : String(selected);
  }

  function renderSingle() {
    var r = state.report, row = rowOf(selected);
    var f = $("banner-frame");
    f.width = r.width; f.height = r.height;
    f.style.width = r.width + "px"; f.style.height = r.height + "px";
    $("stage").style.width = r.width + "px"; $("stage").style.height = r.height + "px";
    var ov = $("error-overlay");
    if (row.error) {
      ov.hidden = false;
      ov.textContent = "";
      ov.appendChild(el("code", errText(row.error)));
      ov.appendChild(el("div", "Deze regel kan niet worden gevuld."));
      setGifAllowed(false);
      f.hidden = true;
      f.removeAttribute("src");
    } else {
      ov.hidden = true;
      f.hidden = false;
      navStart = performance.now();
      f.src = frameSrc(selected);
    }
    $("scrubber").hidden = true;
    $("scrubber-note").hidden = true;
    $("ready-badge").hidden = true;
    clearTimeout(readyTimer);
  }

  function renderOverview() {
    var box = $("overview"), r = state.report;
    box.textContent = "";
    var rows = visibleRows();
    if (!rows.length) box.appendChild(el("p", "Geen regel bevat “" + query + "”.", "muted"));
    rows.forEach(function (row) {
      var cell = el("div", null, "cell");
      var lab = el("button", row.label, "label");
      lab.type = "button";
      lab.title = "Toon alleen deze regel";
      lab.addEventListener("click", function () { selected = row.index; view = "row"; render(); });
      cell.appendChild(lab);
      var b = el("div", null, "box");
      b.style.width = r.width + "px"; b.style.height = r.height + "px";
      if (row.error) {
        b.appendChild(el("div", errText(row.error), "rowerr"));
      } else {
        var fr = document.createElement("iframe");
        fr.width = r.width; fr.height = r.height;
        fr.title = row.label;
        fr.setAttribute("sandbox", "allow-scripts"); /* scripts only: the banner stays a stranger to the page */
        fr.src = frameSrc(row.index);
        b.appendChild(fr);
      }
      cell.appendChild(b);
      box.appendChild(cell);
    });
  }

  function list(parent, title, items, cls) {
    if (!items || !items.length) return;
    parent.appendChild(el("h2", title));
    var ul = el("ul", null, cls);
    items.forEach(function (t) { ul.appendChild(el("li", t)); });
    parent.appendChild(ul);
  }
  function renderReport() {
    var box = $("field-report");
    box.textContent = "";
    box.appendChild(el("strong", "Veldrapport"));
    var rows = view === "all" ? visibleRows() : [rowOf(selected)];
    var any = false;
    rows.forEach(function (row) {
      var has = (row.unfilled || []).length || (row.unused || []).length || (row.warnings || []).length;
      if (!has) return;
      any = true;
      var sec = el("div");
      if (rows.length > 1) sec.appendChild(el("h3", row.label));
      list(sec, "Velden zonder waarde", row.unfilled);
      list(sec, "Kolommen die het sjabloon niet gebruikt", row.unused);
      list(sec, "Waarschuwingen", row.warnings, "warn");
      box.appendChild(sec);
    });
    if (!any) box.appendChild(el("p", "Geen opmerkingen.", "muted"));
  }

  /* The session is one paid hour from its first fill. When it has run out the
     line says so, because the next change starts a new hour at 1 credit; the
     page checks every 20 seconds, it does not wait for a refill. */
  function renderCharge() {
    var c = state && state.report && state.report.charge;
    var until = c && c.session_until ? Date.parse(c.session_until) : NaN;
    var b = $("charge");
    if (!isNaN(until) && Date.now() >= until) {
      b.textContent = "sessie verlopen: de volgende wijziging start een nieuw uur (1 credit)";
      b.setAttribute("data-expired", "true");
    } else {
      b.textContent = (state && state.charge) || "";
      b.removeAttribute("data-expired");
    }
  }
  setInterval(function () { if (state && state.report) renderCharge(); }, 20000);

  function render() {
    var r = state.report;
    $("size-label").textContent = r.width + " × " + r.height;
    renderPicker();
    $("overview-toggle").setAttribute("aria-pressed", String(view === "all"));
    $("view-row").setAttribute("aria-pressed", String(view !== "all"));
    /* a real render is of one row: only offered where one row is shown */
    $("render-panel").hidden = view === "all";
    $("render-title").textContent = "Echte render van " + rowOf(selected).label;
    if (view === "row") showResultFor(selected);
    $("single").hidden = view === "all";
    $("overview").hidden = view !== "all";
    if (view === "all") renderOverview(); else renderSingle();
    renderReport();
    renderCharge();
    renderFailure();
    writeHash();
  }

  function renderFailure() {
    var b = $("refill-error");
    b.hidden = !state.failure;
    b.textContent = state.failure ? "Vernieuwen mislukt, de laatste goede banner blijft staan: " + state.failure : "";
  }

  /* ready signal */
  function showReady(ms) {
    var b = $("ready-badge");
    b.hidden = false;
    if (ms == null) { b.className = "late"; b.textContent = "geen klaar-signaal binnen 10 s"; }
    else { b.className = ""; b.textContent = "klaar-signaal na " + Math.round(ms) + " ms"; }
  }
  function setupReady(usesReady) {
    clearTimeout(readyTimer);
    if (!usesReady) { $("ready-badge").hidden = true; return; }
    if (readyAt[selected] != null) { showReady(readyAt[selected] - navStart); return; }
    var left = Math.max(0, 10000 - (performance.now() - navStart));
    readyTimer = setTimeout(function () {
      if (readyAt[selected] == null) showReady(null);
    }, left);
  }
  window.addEventListener("message", function (ev) {
    if (!ev.data) return;
    var f = $("banner-frame");
    if (view !== "row" || ev.source !== f.contentWindow) return;
    if (ev.data.type === "taufinity-ready") {
      readyAt[selected] = performance.now();
      showReady(readyAt[selected] - navStart);
    } else if (ev.data.type === "taufinity-driver") {
      /* the banner (another origin, sandboxed) tells what it offers; we never look inside it */
      setupReady(ev.data.usesReady === true);
      setupScrubber(ev.data.driver);
    }
  });

  /* animation scrubber: __taufinitySeek first, then the global timeline, else nothing */
  /* driver:start */
  function findDriver(win) {
    var seekFn = typeof win.__taufinitySeek === "function";
    var tl = globalTimelineOf(win);
    if (seekFn) {
      return { kind: "seek", seek: function (t) { win.__taufinitySeek(t); }, duration: durationOf(win, tl) };
    }
    if (tl) {
      return {
        kind: "timeline",
        seek: function (t) { tl.pause(); tl.seek(t); },
        duration: durationOf(win, tl)
      };
    }
    return null;
  }
  function globalTimelineOf(win) {
    var g = win.gsap;
    return g && g.globalTimeline ? g.globalTimeline : null;
  }
  function durationOf(win, tl) {
    var d = win.__taufinityDuration;
    if (typeof d === "function") { try { d = d(); } catch (e) { d = null; } }
    if (typeof d === "number" && d > 0 && isFinite(d)) return d;
    if (tl && typeof tl.duration === "function") {
      var td = tl.duration();
      if (td > 0 && isFinite(td)) return td;
    }
    return 10;
  }
  /* driver:end */
  function setupScrubber(info) {
    var wrap = $("scrubber"), note = $("scrubber-note"), range = $("scrubber-range");
    var dur = info && typeof info.duration === "number" && isFinite(info.duration) && info.duration > 0 ? info.duration : 0;
    setGifAllowed(!!dur);
    if (!dur) { wrap.hidden = true; note.hidden = false; return; }
    note.hidden = true;
    wrap.hidden = false;
    range.max = String(dur);
    range.value = "0";
    $("scrubber-time").textContent = "0.00 s";
    range.oninput = function () {
      var t = parseFloat(range.value);
      $("scrubber-time").textContent = t.toFixed(2) + " s";
      var w = $("banner-frame").contentWindow;
      if (w) w.postMessage({ type: "taufinity-seek", t: t }, "*"); /* the banner decides what to do with it */
    };
  }

  /* the server refuses a GIF or video of a banner without a timeline, so the
     choice is not offered; PNG is chosen instead */
  function setGifAllowed(ok) {
    var gif = document.querySelector('input[name="render-format"][value="gif"]');
    if (!gif) return;
    gif.disabled = !ok;
    gif.parentNode.title = ok ? "" : "Deze banner heeft geen tijdlijn, dus een GIF kan niet: kies PNG";
    if (!ok && gif.checked) document.querySelector('input[name="render-format"][value="png"]').checked = true;
  }
  $("row-picker").addEventListener("change", function () {
    if (this.value === "") return;
    selected = parseInt(this.value, 10);
    view = "row";
    render();
  });
  $("row-search").addEventListener("input", function () {
    query = norm(this.value.trim());
    if (view === "row" && query) {
      var rows = visibleRows();
      if (rows.length && !rows.some(function (r) { return r.index === selected; })) selected = rows[0].index;
    }
    render();
  });
  $("overview-toggle").addEventListener("click", function () { view = "all"; render(); });
  $("view-row").addEventListener("click", function () { view = "row"; render(); });

  /* real render: costs credits, asked once and then remembered in this browser */
  var CONFIRM_KEY = "taufinity.preview.renderConfirmed";
  /* no figure here: the price per type of banner is the one in the agreement,
     and a number on this page would only drift from it */
  var PRICE = "het normale tarief voor dit type banner (stilstaand beeld of animatie), zoals in de overeenkomst";
  function chosenFormat() {
    var r = document.querySelector('input[name="render-format"]:checked');
    return r ? r.value : "png";
  }
  function isConfirmed() {
    try { return localStorage.getItem(CONFIRM_KEY) === "1"; } catch (e) { return false; }
  }
  function renderError(msg) {
    var b = $("render-error");
    b.hidden = !msg;
    b.textContent = msg || "";
  }
  /* Real render results belong to the row they were made of: switching rows
     shows that row's own result (or none), and a render that finishes after a
     switch is kept for its row instead of appearing under another. A refill
     (the template changed) makes earlier results stale, so they are dropped. */
  var results = {};
  function showResultFor(index) {
    var box = $("render-result"), r = results[index];
    renderError(r && r.error ? r.error : "");
    if (r && r.body) { showRenderResult(r.body); return; }
    box.hidden = true;
    box.textContent = "";
  }
  function startRender() {
    var btn = $("render-button");
    var fmt = chosenFormat();
    var row = selected;
    var token = (document.querySelector('meta[name="preview-token"]') || {}).content || "";
    btn.disabled = true;
    btn.textContent = "";
    btn.appendChild(el("span", "Bezig met renderen", "dots"));
    renderError("");
    $("render-result").hidden = true; /* an earlier result must not read as this one's */
    $("render-result").textContent = "";
    fetch("/api/render", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Preview-Token": token },
      body: JSON.stringify({ row: row, format: fmt })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, body: j }; });
    }).then(function (res) {
      results[row] = res.ok ? { body: res.body } : { error: res.body.error || "De echte render is mislukt." };
    }).catch(function () {
      results[row] = { error: "Geen verbinding met de lokale preview." };
    }).then(function () {
      if (selected === row && view === "row") showResultFor(row);
      btn.disabled = false;
      btn.textContent = "Echte render (normale prijs)";
    });
  }
  function showRenderResult(j) {
    var box = $("render-result");
    box.textContent = "";
    box.hidden = false;
    var status = j.status === "succeeded" ? "Gelukt" : "Niet gehaald";
    box.appendChild(el("div", "Status: " + status + " | " + j.bytes + " bytes | " + String(j.format).toUpperCase()));
    if (j.notes) box.appendChild(el("div", "Opmerkingen: " + j.notes, "muted"));
    if (j.url) {
      var img = document.createElement("img");
      img.id = "render-image";
      img.alt = "Echte render";
      img.src = j.url;
      box.appendChild(img);
    }
  }
  $("render-button").addEventListener("click", function () {
    if (isConfirmed()) { startRender(); return; }
    $("render-modal-price").textContent = "Prijs: " + PRICE + ".";
    $("render-modal").hidden = false;
  });
  $("render-cancel").addEventListener("click", function () { $("render-modal").hidden = true; });
  $("render-confirm").addEventListener("click", function () {
    try { localStorage.setItem(CONFIRM_KEY, "1"); } catch (e) { /* not remembered */ }
    $("render-modal").hidden = true;
    startRender();
  });

  function load() {
    return fetch("/api/state", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (s) {
      var reload = state && s.report && s.version !== state.version && !s.failure;
      state = s;
      if (!s.report) return;
      if (reload) { readyAt = {}; results = {}; }
      if (reload || !document.querySelector("#row-picker option")) render(); else renderFailure();
    });
  }

  readHash();
  query = norm($("row-search").value.trim()); /* a value the browser restored */
  load();
  var es = new EventSource("/events");
  es.addEventListener("reload", function () { load(); });
  es.addEventListener("failure", function () { load(); });
})();
</script>
</body>
</html>
